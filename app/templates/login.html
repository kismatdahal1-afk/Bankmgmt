<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Login - Village Bank</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <!-- Flash messages inside login -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">
                            <span>{{ message }}</span>
                            <span class="material-symbols-rounded" style="cursor: pointer; font-size: 1.2rem;" onclick="this.parentElement.remove()">close</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="login-card">
            <div class="login-header">
                <span class="material-symbols-rounded" style="color: var(--accent-color); font-size: 3rem; margin-bottom: 12px;">account_balance</span>
                <h2>Village Bank Portal</h2>
                <p>Enter your operator credentials to manage bank systems</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                    <label for="username">Operator Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or staff" required autocomplete="username">
                </div>
                
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%;">
                    <span class="material-symbols-rounded">login</span>
                    Authenticate Session
                </button>
            </form>
        </div>
    </div>
</body>
</html>
